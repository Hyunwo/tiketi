apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tiketi-ingress
  namespace: tiketi
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # Health checks (모든 서비스에서 사용)
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3001
      
      # API Docs (Auth Service)
      - path: /api-docs
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3001
      
      # Auth Service
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3001
      
      # Ticket Service (가장 많은 경로를 가진 서비스)
      - path: /api/events
        pathType: Prefix
        backend:
          service:
            name: ticket-service
            port:
              number: 3002
      
      - path: /api/seats
        pathType: Prefix
        backend:
          service:
            name: ticket-service
            port:
              number: 3002
      
      - path: /api/tickets
        pathType: Prefix
        backend:
          service:
            name: ticket-service
            port:
              number: 3002
      
      - path: /api/queue
        pathType: Prefix
        backend:
          service:
            name: ticket-service
            port:
              number: 3002
      
      - path: /api/news
        pathType: Prefix
        backend:
          service:
            name: ticket-service
            port:
              number: 3002
      
      # Payment Service
      - path: /api/payments
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 3003
      
      - path: /api/reservations
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 3003
      
      # Stats Service
      - path: /api/stats
        pathType: Prefix
        backend:
          service:
            name: stats-service
            port:
              number: 3004
      
      - path: /api/admin
        pathType: Prefix
        backend:
          service:
            name: stats-service
            port:
              number: 3004
